<!-- ================================================================
  ICCR HOMEPAGE — MEA.GOV.IN REPLICA BLOCKS
  BLOCK 1 (mhx-) : Hero highlights banner  — auto-advance every 5s
  BLOCK 2 (pbx-) : Gagananchal | Annual Report | Press Releases
                   + Video Briefings column (MEA layout)
  BLOCK 3 (cdx-) : Incoming / Outgoing Cultural Delegations |
                   Visitors Programme | Exhibitions (MEA layout)
  All class names are namespaced (mhx / pbx / cdx) so nothing
  collides with existing homepage CSS. Vanilla JS, no libraries.
  Editable data lives in the small JS arrays marked "EDIT DATA".
================================================================= -->

<style>
/* ---- MEA look & feel: shared fonts + palette (loaded once) ---- */
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;500;600&family=Roboto:wght@400;500&display=swap');

.mhx-hero, .pbx-wrap, .cdx-wrap {
  --mea-panel: #E9EDF9;          /* light periwinkle panel */
  --mea-ink: #202124;            /* near-black text */
  --mea-gray: #5F6368;           /* dates / secondary */
  --mea-inactive: #9AA0A6;       /* inactive serif tab */
  --mea-link: #1A73E8;           /* MEA blue links */
  --mea-line: rgba(32,33,36,0.14);
  --mea-serif: 'Noto Serif', Georgia, 'Times New Roman', serif;
  --mea-sans: 'Roboto', 'Segoe UI', Arial, sans-serif;
  font-family: var(--mea-sans);
  box-sizing: border-box;
}
.mhx-hero *, .pbx-wrap *, .cdx-wrap *,
.mhx-hero *::before, .pbx-wrap *::before, .cdx-wrap *::before,
.mhx-hero *::after, .pbx-wrap *::after, .cdx-wrap *::after { box-sizing: border-box; }

/* small uppercase-ish date used everywhere, exactly like MEA */
.mea-date {
  font-family: var(--mea-sans);
  font-size: 12.5px;
  letter-spacing: 0.14em;
  color: var(--mea-gray);
  display: block;
}

/* ================================================================
   BLOCK 1 — HERO HIGHLIGHTS (replica of MEA homepage banner)
================================================================ */
.mhx-hero {
  display: grid;
  grid-template-columns: minmax(0, 2.15fr) minmax(0, 1fr);
  gap: 22px;
  max-width: 1500px;
  margin: 0 auto 14px;
  padding: 0 4px;
}
.mhx-main {
  display: flex;
  flex-direction: column;
  border-radius: 4px;
  overflow: hidden;
  background: #fff;
  box-shadow: 0 1px 6px rgba(32,33,36,0.14);
}
.mhx-stage { position: relative; height: 430px; background: #101418; overflow: hidden; }
.mhx-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 0.7s ease; pointer-events: none; }
.mhx-slide.active { opacity: 1; pointer-events: auto; }
.mhx-slide .mhx-bg {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  filter: blur(28px) brightness(0.9) saturate(1.02);
  transform: scale(1.2);
}
.mhx-slide img.mhx-photo {
  position: absolute; inset: 0; margin: auto;
  max-width: 100%; height: 100%; object-fit: contain; z-index: 2;
}
.mhx-caption {
  background: var(--mea-panel);
  padding: 22px 30px 24px;
  min-height: 176px;
  display: flex; flex-direction: column; gap: 10px;
}
.mhx-caption h2 {
  margin: 0;
  font-family: var(--mea-sans);
  font-weight: 400;
  font-size: clamp(18px, 1.6vw, 24px);
  line-height: 1.5;
  color: var(--mea-ink) !important;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  transition: opacity 0.3s ease;
}
.mhx-caption.fading h2, .mhx-caption.fading .mea-date { opacity: 0; }
.mhx-caption .mea-date { transition: opacity 0.3s ease; }
.mhx-viewall {
  margin-top: auto; align-self: flex-start;
  font-size: 14px; font-weight: 500; color: var(--mea-link);
  text-decoration: none !important;
}
.mhx-viewall:hover { text-decoration: underline !important; }

/* side column */
.mhx-side { display: flex; flex-direction: column; gap: 16px; min-width: 0; height: 100%; position: relative; }
.mhx-side-list { display: flex; flex-direction: column; gap: 16px; flex: 1; min-width: 0; min-height: 0; }

/* CRITICAL: our own display:flex would otherwise override the hidden
   attribute — this guarantees ONLY the 2 visible cards ever render */
.mhx-side-card[hidden] { display: none !important; }

.mhx-side-card {
  display: flex; flex-direction: column;
  flex: 1 1 0;          /* the 2 visible cards split the column equally */
  min-height: 0;
  border-radius: 4px; overflow: hidden;
  background: #fff; box-shadow: 0 1px 5px rgba(32,33,36,0.14);
  cursor: pointer; border: none; padding: 0; text-align: left;
  font-family: inherit;
  transition: box-shadow 0.25s ease;
}
.mhx-side-card:hover { box-shadow: 0 3px 12px rgba(32,33,36,0.22); }

/* rotation animation: each incoming card slides up into place */
@keyframes mhxSlideIn {
  from { opacity: 0; transform: translateY(26px); }
  to   { opacity: 1; transform: translateY(0); }
}
.mhx-side-card.mhx-anim { animation: mhxSlideIn 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
.mhx-side-card.mhx-anim:nth-of-type(1) { animation-delay: 0s; }
@media (prefers-reduced-motion: reduce) {
  .mhx-side-card.mhx-anim { animation: none; }
}

.mhx-side-card .mhx-thumb {
  flex: 1 1 auto;       /* thumb grows so the column matches the main card's height */
  min-height: 120px;
  background-size: cover; background-position: center;
}
.mhx-side-card .mhx-side-text { background: var(--mea-panel); padding: 12px 16px 45px; flex: 0 0 auto; }
.mhx-side-card .mea-date { font-size: 11.5px; margin-bottom: 5px; }
.mhx-side-card p {
  margin: 0;
  font-size: 14px; line-height: 1.5; color: var(--mea-ink);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
/* ▼ ▲ ❚❚ buttons OVERLAP the bottom side card (MEA style) —
   they take no vertical space, so the column bottom lines up
   exactly with the main card bottom */
.mhx-side-nav {
  position: absolute;
  right: 10px;
  bottom: 10px;
  z-index: 5;
  display: flex;
  gap: 6px;
}
.mhx-side-nav button {
  width: 30px; height: 30px; border-radius: 4px;
  border: 1px solid var(--mea-line); background: #fff; color: var(--mea-ink);
  font-size: 13px; line-height: 1; cursor: pointer;
  box-shadow: 0 1px 4px rgba(32,33,36,0.25);
  transition: background 0.2s ease, color 0.2s ease;
}
.mhx-side-nav button:hover { background: var(--mea-link); border-color: var(--mea-link); color: #fff; }

@media (max-width: 900px) {
  .mhx-hero { grid-template-columns: 1fr; gap: 14px; }
  .mhx-stage { height: 250px; }
  .mhx-caption { min-height: 0; padding: 16px 18px 18px; }
  .mhx-caption h2 { -webkit-line-clamp: 4; }
  .mhx-side { height: auto; }
  .mhx-side-list { flex-direction: row; }
  .mhx-side-card { flex: 1; }
  .mhx-side-card .mhx-thumb { flex: none; height: 96px; min-height: 0; }
  .mhx-side-card p { font-size: 12px; }
  .mhx-side-nav { right: 6px; bottom: 6px; }
}

/* ================================================================
   BLOCK 2 — PUBLICATIONS & MEDIA (replica of MEA "Press Releases
   | Speeches & Statements + Video Briefings" panel)
================================================================ */
.pbx-wrap {
  max-width: 1500px;
  margin: 34px auto;
  padding: 34px 44px 30px;
  background: var(--mea-panel);
  border-radius: 6px;
  content-visibility: auto;
  contain-intrinsic-size: 480px;
}
.pbx-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.9fr) minmax(0, 1fr);
  gap: 56px;
}
.pbx-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 18px; margin-bottom: 6px; flex-wrap: wrap;
}
.pbx-tabs { display: flex; align-items: baseline; flex-wrap: wrap; }
.pbx-tab {
  font-family: var(--mea-serif);
  font-size: clamp(20px, 1.75vw, 27px);
  font-weight: 500;
  color: var(--mea-inactive);
  background: none; border: none; padding: 0; cursor: pointer;
  transition: color 0.25s ease;
  line-height: 1.3;
}
.pbx-tab:hover { color: var(--mea-ink); }
.pbx-tab.active { color: var(--mea-ink); }
.pbx-sep {
  width: 1px; height: 22px; background: var(--mea-line);
  margin: 0 18px; align-self: center;
}
.pbx-viewall-top, .pbx-viewall-bottom, .pbx-vb-viewall {
  font-size: 13.5px; font-weight: 500; color: var(--mea-link);
  text-decoration: none !important; white-space: nowrap;
}
.pbx-viewall-top:hover, .pbx-viewall-bottom:hover, .pbx-vb-viewall:hover { text-decoration: underline !important; }

/* list rows */
.pbx-row {
  display: flex; gap: 16px; align-items: flex-start;
  padding: 16px 0;
  border-bottom: 1px solid var(--mea-line);
}
.pbx-row:last-of-type { border-bottom: none; }
.pbx-thumb {
  width: 62px; height: 82px;
  object-fit: cover; object-position: top;
  border-radius: 3px; background: #fff;
  border: 1px solid var(--mea-line);
  flex-shrink: 0;
}
.pbx-row-body { min-width: 0; }
.pbx-row .mea-date { margin-bottom: 6px; }
.pbx-title {
  margin: 0;
  font-size: 16px; line-height: 1.5; font-weight: 400;
  color: var(--mea-ink);
}
.pbx-title a { color: inherit; text-decoration: none !important; }
.pbx-title a:hover { color: var(--mea-link); }
.pbx-dl {
  display: inline-block; margin-top: 6px;
  font-size: 13px; font-weight: 500; color: var(--mea-link);
  text-decoration: none !important;
}
.pbx-dl:hover { text-decoration: underline !important; }
.pbx-viewall-bottom { display: inline-block; margin-top: 14px; }

/* right column — Video Briefings */
.pbx-vb-title {
  font-family: var(--mea-serif);
  font-size: clamp(20px, 1.75vw, 27px);
  font-weight: 500; color: var(--mea-ink);
  margin: 0; line-height: 1.3;
}
.pbx-vb-card { display: block; text-decoration: none !important; margin-top: 14px; }
.pbx-vb-card img {
  width: 100%; aspect-ratio: 16 / 9.4; object-fit: cover;
  display: block; border-radius: 3px; background: #101418;
}
.pbx-vb-card .mea-date { margin: 14px 0 6px; }
.pbx-vb-card p {
  margin: 0;
  font-size: 16.5px; line-height: 1.5; color: var(--mea-ink); font-weight: 400;
}
.pbx-vb-card:hover p { color: var(--mea-link); }

@media (max-width: 1000px) {
  .pbx-wrap { padding: 24px 18px 22px; }
  .pbx-grid { grid-template-columns: 1fr; gap: 34px; }
  .pbx-sep { margin: 0 12px; height: 18px; }
}

/* ================================================================
   BLOCK 3 — CULTURAL DELEGATIONS (replica of MEA "Outgoing Visits
   | Incoming Visits | Other Summits and Meetings" panel)
================================================================ */
.cdx-wrap {
  max-width: 1500px;
  margin: 34px auto;
  padding: 34px 44px 30px;
  background: var(--mea-panel);
  border-radius: 6px;
  content-visibility: auto;
  contain-intrinsic-size: 420px;
}
.cdx-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 18px; margin-bottom: 22px; flex-wrap: wrap;
}
.cdx-tabs { display: flex; align-items: baseline; flex-wrap: wrap; row-gap: 8px; }
.cdx-tab {
  font-family: var(--mea-serif);
  font-size: clamp(18px, 1.55vw, 25px);
  font-weight: 500;
  color: var(--mea-inactive);
  background: none; border: none; padding: 0; cursor: pointer;
  transition: color 0.25s ease; line-height: 1.3;
}
.cdx-tab:hover, .cdx-tab.active { color: var(--mea-ink); }
.cdx-sep { width: 1px; height: 20px; background: var(--mea-line); margin: 0 16px; align-self: center; }
.cdx-viewall {
  font-size: 13.5px; font-weight: 500; color: var(--mea-link);
  text-decoration: none !important; white-space: nowrap;
}
.cdx-viewall:hover { text-decoration: underline !important; }

.cdx-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  column-gap: 64px;
  row-gap: 26px;
}
.cdx-item {
  display: flex; gap: 20px; align-items: flex-start;
  text-decoration: none !important;
}
.cdx-item img {
  width: 132px; height: 88px;
  object-fit: cover;
  background: #fff;
  border: 1px solid var(--mea-line);
  border-radius: 2px;
  flex-shrink: 0;
}
.cdx-item-body { min-width: 0; }
.cdx-item .mea-date { margin-bottom: 6px; }
.cdx-item p {
  margin: 0;
  font-size: 16px; line-height: 1.5; font-weight: 400;
  color: var(--mea-ink);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.cdx-item:hover p { color: var(--mea-link); }
.cdx-bottom-viewall {
  display: inline-block; margin-top: 22px;
  font-size: 13.5px; font-weight: 500; color: var(--mea-link);
  text-decoration: none !important;
}
.cdx-bottom-viewall:hover { text-decoration: underline !important; }

@media (max-width: 900px) {
  .cdx-wrap { padding: 24px 18px 22px; }
  .cdx-grid { grid-template-columns: 1fr; row-gap: 20px; }
  .cdx-sep { margin: 0 10px; height: 16px; }
  .cdx-item img { width: 104px; height: 72px; }
}
</style>

================================================================= -->
<section class="mhx-hero" id="mhx-hero">
  <div class="mhx-main">
    <div class="mhx-stage" id="mhx-stage"></div>
    <div class="mhx-caption" id="mhx-caption">
      <span class="mea-date" id="mhx-date"></span>
      <h2 id="mhx-title"></h2>
    </div>
  </div>
  <aside class="mhx-side">
    <div class="mhx-side-list" id="mhx-side-list"></div>
    <div class="mhx-side-nav">
      <button type="button" id="mhx-next" aria-label="Next highlight">&#9660;</button>
      <button type="button" id="mhx-prev" aria-label="Previous highlight">&#9650;</button>
      <button type="button" id="mhx-pause" aria-label="Pause slideshow">&#10074;&#10074;</button>
    </div>
  </aside>
</section>

<script>
(function () {
  /* ============ EDIT DATA — hero slides ============ */
  var MHX_SLIDES = [
    {
      img: "https://iccr.gov.in/sites/default/files/homepage/2.jpeg",
      date: "02 July, 2026",
      title: "DG, ICCR Mrs. K. Nandini Singla met H.E. Ms. Mahishini Colonne, High Commissioner of Sri Lanka to India, at ICCR HQ, New Delhi to explore specific areas of cultural collaboration and strengthen bilateral relations."
    },
    {
      img: "https://iccr.gov.in/sites/default/files/homepage/3.jpeg",
      date: "30 June, 2026",
      title: "DG, ICCR Smt K. Nandini Singla and Secretary, Information & Cultural Affairs, Government of West Bengal Dr. Saumitra Mohan signed a landmark MoU at Kolkata to promote West Bengal's vibrant traditions, performing arts, and handicrafts internationally through ICCR's global network."
    },
    {
      img: "https://iccr.gov.in/sites/default/files/homepage/1.jpeg",
      date: "25 June, 2026",
      title: "Ms. Manisha Swami, DDG, ICCR met with Gimhae Vice Mayor Mr. Shin Dae-ho to expand cultural cooperation and visited the India Pavilion at Gaya Theme Park to review the \"Mythologies of India: Born from the Brush\" exhibition."
    },
    {
      img: "https://iccr.gov.in/sites/default/files/homepage/4.jpeg",
      date: "23 June, 2026",
      title: "A proud moment for India's global medical heritage as the statue of Maharishi Sushruta, the Father of Surgery, is unveiled at the world's oldest surgical college in Edinburgh, Scotland."
    }
  ];
  var MHX_INTERVAL = 5000; /* 5 seconds */

  var stage = document.getElementById("mhx-stage");
  var sideList = document.getElementById("mhx-side-list");
  var captionBox = document.getElementById("mhx-caption");
  var dateEl = document.getElementById("mhx-date");
  var titleEl = document.getElementById("mhx-title");
  var n = MHX_SLIDES.length;
  var idx = 0, timer = null;

  /* main slides — only the first image loads eagerly */
  var slideEls = MHX_SLIDES.map(function (s, i) {
    var d = document.createElement("div");
    d.className = "mhx-slide" + (i === 0 ? " active" : "");
    var bg = document.createElement("div");
    bg.className = "mhx-bg";
    bg.style.backgroundImage = "url('" + s.img + "')";
    var img = document.createElement("img");
    img.className = "mhx-photo";
    img.src = s.img;
    img.alt = s.title;
    img.decoding = "async";
    if (i > 0) img.loading = "lazy";
    d.appendChild(bg); d.appendChild(img);
    stage.appendChild(d);
    return d;
  });

  /* side cards (built once; the two after the active slide stay visible) */
  var sideEls = MHX_SLIDES.map(function (s, i) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "mhx-side-card";
    b.innerHTML =
      '<span class="mhx-thumb" style="background-image:url(\'' + s.img + '\')"></span>' +
      '<span class="mhx-side-text"><span class="mea-date">' + s.date + '</span><p>' + s.title + '</p></span>';
    b.addEventListener("click", function () { goTo(i); restart(); });
    sideList.appendChild(b);
    return b;
  });

  function setCaption(s) {
    captionBox.classList.add("fading");
    setTimeout(function () {
      dateEl.textContent = s.date;
      titleEl.textContent = s.title;
      captionBox.classList.remove("fading");
    }, 160);
  }

  function goTo(i) {
    idx = (i + n) % n;
    slideEls.forEach(function (el, k) { el.classList.toggle("active", k === idx); });

    /* exactly TWO side cards: the next two slides after the active one */
    var a = (idx + 1) % n, b = (idx + 2) % n;
    sideEls.forEach(function (el, k) {
      var show = (k === a || k === b);
      el.hidden = !show;
      el.style.order = (k === a) ? 1 : 2;
      /* reset animation so it can re-trigger */
      el.classList.remove("mhx-anim");
      el.style.animationDelay = "";
    });

    /* slide-in animation: top card first, second card slightly after */
    requestAnimationFrame(function () {
      sideEls[a].style.animationDelay = "0s";
      sideEls[b].style.animationDelay = "0.12s";
      sideEls[a].classList.add("mhx-anim");
      sideEls[b].classList.add("mhx-anim");
    });

    setCaption(MHX_SLIDES[idx]);
  }

  function start() {
  if (!timer && isPlaying && !isHovered) {
    timer = setInterval(function () { goTo(idx + 1); }, MHX_INTERVAL);
    }
  }
  function stop() { clearInterval(timer); timer = null; }
  function restart() { stop(); start(); }

  var isPlaying = true;
  var pauseBtn = document.getElementById("mhx-pause");
  pauseBtn.addEventListener("click", function () {
    isPlaying = !isPlaying;
    pauseBtn.innerHTML = isPlaying ? "&#10074;&#10074;" : "&#9654;";
    pauseBtn.setAttribute("aria-label", isPlaying ? "Pause slideshow" : "Play slideshow");
    if (isPlaying) start(); else stop();
  });

  document.getElementById("mhx-next").addEventListener("click", function () { goTo(idx + 1); restart(); });
  document.getElementById("mhx-prev").addEventListener("click", function () { goTo(idx - 1); restart(); });

    var hero = document.getElementById("mhx-hero");
    var isHovered = false;
    hero.addEventListener("mouseenter", function () { isHovered = true; stop(); });
    hero.addEventListener("mouseleave", function () { isHovered = false; start(); });
    document.addEventListener("visibilitychange", function () { if (document.hidden) stop(); else start(); });

  goTo(0);
  start();
})();
</script>
